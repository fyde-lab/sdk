[package]
name = "fyde-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
futures-util = "0.3.34"
prost = "0.14.4"
rand = "0.10.2"
rmp-serde = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.15"
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
xdg = "2.5.2"

[build-dependencies]
tonic-prost-build = "0.14.6"
