[package]
name = "fyde-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
xdg = "2.5.2"
