[package]
name = "fyde-sdk"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.5.3"
async-trait = "0.1.92"
fs2 = "0.4.3"
futures = "0.3.34"
lopdf = "0.39"
prost = "0.14.4"
rand = "0.10.2"
rmp-serde = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.15"
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["registry", "fmt"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
uniffi = { version = "=0.32.0", features = ["tokio"] }
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }
xdg = "2.5.2"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
mockall = "0.15.0"
tempfile = "3.14.0"
tokio = { version = "1.53.1", features = ["test-util"] }
