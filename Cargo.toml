[package]
name = "fyde-sdk"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.5.3"
async-trait = "0.1.92"
futures = "0.3.34"
hkdf = "0.12.4"
# `vendored` builds Lua from source rather than requiring a system install —
# needed since this crate cross-compiles to Android/iOS (see `../CLAUDE.md`'s
# `application/` entry) where no system Lua exists.
# `error-send` makes `mlua::Error` itself `Send + Sync`, required since it's
# wrapped into this crate's `Error` enum, which is held across `.await`
# points throughout the SDK.
mlua = { version = "0.12.1", features = ["lua54", "vendored", "error-send"] }
opaque-ke = { version = "4.0.1", features = ["argon2"] }
# Pinned: 0.3.78+ requires `office_oxide ^0.1.9`, and every 0.1.9+ release of
# `office_oxide` published so far fails to build against pdf_oxide's usage
# (a missing-field compile error in `DocumentIR` construction) — an upstream
# semver break. 0.3.77 itself only requires `office_oxide "0.1.8"` (a caret
# range, so Cargo can still resolve the same broken 0.1.9+ releases unless
# pinned directly below), and 0.1.8 is the last working release.
pdf_oxide = "=0.3.77"
office_oxide = "=0.1.8"
prost = "0.14.4"
rand = "0.10.2"
# `opaque-ke` itself depends on `rand 0.8` with no features enabled;
# depending on it here too, with `getrandom`, is purely to turn that
# feature on via Cargo's feature unification for the resolved `rand 0.8`
# instance `opaque_ke::rand::rngs::OsRng` (used throughout `users/crypto.rs`)
# comes from — nothing in this crate names `rand08` directly.
rand08 = { package = "rand", version = "0.8.5", features = ["getrandom"] }
rmp-serde = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.15"
serde_json = "1.0.151"
sha2 = "0.11.0"
# `opaque-ke` pins `digest = "0.10"` internally, which `sha2 = "0.11"` above
# (a breaking upgrade) no longer satisfies; this separately-versioned,
# renamed dependency is used only for the `Sha512`/`Sha256` types
# `users/crypto.rs` needs to line up with `opaque-ke`'s own ciphersuite and
# HKDF machinery.
sha2-opaque = { package = "sha2", version = "0.10.9" }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["registry", "fmt"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
uniffi = { version = "=0.32.0", features = ["tokio"] }
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }
xdg = "2.5.2"

[build-dependencies]
tonic-prost-build = "0.14.6"

# Argon2id runs as OPAQUE's key-stretching function on every login/registration
# (see `users/crypto.rs`'s `high_effort_ksf`), and its RFC 9106 low-memory
# params (64 MiB, 3 iterations, 4 lanes) are deliberately expensive. Without
# this override, an unoptimized debug build takes ~3s per call versus ~200ms
# in release — opting just these crates into full optimization even under
# `cargo build`/`cargo test` (no --release) keeps debug builds usable without
# losing debug info for the rest of this crate.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[dev-dependencies]
anyhow = "1.0.104"
# Only used to spin up a real server in `tests/` (see `tests/common/mod.rs`);
# `../server` in turn dev-depends on this crate for its own `tests/` in the
# other direction, which is a supported cargo pattern since neither side's
# regular dependencies (only their dev-dependencies) form the cycle.
fyde-server = { path = "../server" }
# Only used to hand-build minimal PDF fixtures for `documents/transcript.rs`
# tests; extraction itself uses `pdf_oxide` (a regular dependency).
lopdf = "0.39"
mockall = "0.15.0"
# Only used to force the `tests/` end-to-end suite to run serially (see
# `tests/common/mod.rs` and the sdk CLAUDE.md's "must run serially" note) —
# its lock is filesystem-based, so it serializes across the separate test
# binaries `tests/` compiles into, not just threads within one binary.
serial_test = "3.2.0"
tempfile = "3.14.0"
tokio = { version = "1.53.1", features = ["test-util"] }
