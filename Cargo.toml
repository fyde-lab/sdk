[package]
name = "fyde-sdk"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.5.3"
async-trait = "0.1.92"
# `fyde.browser:download` gets its bytes back over IPC base64-encoded
# (`domains/scrapers/browser/driver.rs`'s `fetch_script`).
base64 = "0.22.1"
# Cookie type `wry`'s `WebView::cookies`/`set_cookie` speak — must stay on the
# same major version `wry` itself depends on.
cookie = "0.18"
# Decodes `fyde.http` text bodies in their `charset` (`domains/scrapers/host/http.rs`'s
# `decode_text`), the way `wreq::Response::text` would.
encoding_rs = "0.8.41"
futures = "0.3.34"
hkdf = "0.12.4"
# The `secrets` domain (`domains/secrets`) keeps the account master key and
# the session token in the OS's native credential store rather than in the
# local SQLite database. `keyring-core` is the store-agnostic API; each
# platform pulls in only its own native store below (the all-in-one `keyring`
# crate's own docs advise apps that pick their stores per platform to depend
# on these directly instead). See `storage_keystore.rs` for which store each
# platform uses.
keyring-core = "1.0.0"
# `vendored` builds Lua from source rather than requiring a system install —
# needed since this crate cross-compiles to Android/iOS (see `../CLAUDE.md`'s
# `application/` entry) where no system Lua exists.
# `error-send` makes `mlua::Error` itself `Send + Sync`, required since it's
# wrapped into this crate's `Error` enum, which is held across `.await`
# points throughout the SDK.
# `serialize` enables `LuaSerdeExt` (`to_value`/`from_value`), used by the
# scrapers domain (`domains/scrapers`) to round-trip JSON through Lua tables.
mlua = { version = "0.12.1", features = ["lua54", "vendored", "error-send", "serialize"] }
opaque-ke = { version = "4.0.1", features = ["argon2"] }
# Pinned: 0.3.78+ requires `office_oxide ^0.1.9`, and every 0.1.9+ release of
# `office_oxide` published so far fails to build against pdf_oxide's usage
# (a missing-field compile error in `DocumentIR` construction) — an upstream
# semver break. 0.3.77 itself only requires `office_oxide "0.1.8"` (a caret
# range, so Cargo can still resolve the same broken 0.1.9+ releases unless
# pinned directly below), and 0.1.8 is the last working release.
pdf_oxide = "=0.3.77"
office_oxide = "=0.1.8"
prost = "0.14.4"
rand = "0.10.2"
# `opaque-ke` itself depends on `rand 0.8` with no features enabled;
# depending on it here too, with `getrandom`, is purely to turn that
# feature on via Cargo's feature unification for the resolved `rand 0.8`
# instance `opaque_ke::rand::rngs::OsRng` (used throughout `users/crypto.rs`)
# comes from — nothing in this crate names `rand08` directly.
rand08 = { package = "rand", version = "0.8.5", features = ["getrandom"] }
rmp-serde = "1.3.0"
# `fyde.html.select` (`domains/scrapers/host/html.rs`) — re-parses the given
# HTML string on every call rather than keeping long-lived document handles,
# same approach and version as `demo-rust-fyde`.
scraper = "0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.15"
serde_json = "1.0.151"
sha2 = "0.11.0"
# `opaque-ke` pins `digest = "0.10"` internally, which `sha2 = "0.11"` above
# (a breaking upgrade) no longer satisfies; this separately-versioned,
# renamed dependency is used only for the `Sha512`/`Sha256` types
# `users/crypto.rs` needs to line up with `opaque-ke`'s own ciphersuite and
# HKDF machinery.
sha2-opaque = { package = "sha2", version = "0.10.9" }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2.0.20"
# Only the features this crate's own code uses (a library enabling `full`
# forces every runtime feature on every app that depends on it). `net`,
# `io-util` and the multi-thread runtime are only needed by tests — see the
# dev-dependency below.
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["registry", "fmt"] }
# `NormalizeEvent`: recovers the real target of records `tracing-subscriber`
# bridges from the `log` crate (e.g. `pdf_oxide`'s), see `tools::log`.
tracing-log = "0.2.0"
# `tls-ring`/`tls-webpki-roots`: TLS for `https://` server URLs (see
# `lazy_channel` in `src/lib.rs`), with Mozilla's root store bundled in
# rather than read from the OS, which Android/iOS don't expose the same way
# desktops do.
tonic = { version = "0.14.6", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
# Windows the real webview `fyde.browser` (`domains/scrapers/host/browser.rs`,
# `domains/scrapers/browser/driver.rs`) drives — `tao` provides the
# event-loop/window `wry`'s `WebView` attaches to (on Linux via
# `WebViewBuilder::build_gtk`, pairing with `tao`'s GTK main-loop
# integration; the plain `winit` crate doesn't drive GTK's own main loop,
# which WebKitGTK needs). Needs `webkit2gtk-4.1`/`gtk+-3.0`/`dbus-1`
# (`pkg-config`-discovered) at build time on Linux — see `shell.nix`. Only
# exercised on Linux while writing this; `wry`'s own docs cover macOS/Windows
# as a different `build()` call, not `build_gtk()` — see `driver.rs`.
tao = "0.37"
uniffi = { version = "=0.32.0", features = ["tokio"] }
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }
# Already pulled in transitively by `wreq`; declared directly here too since
# `domains/scrapers/host/mod.rs`'s `ensure_domain_allowed` parses URLs with
# it (host extraction for the `fyde.http`/`fyde.browser` domain allowlist).
url = "2.5.8"
# `fyde.http` (`domains/scrapers/host/http.rs`) — `wreq` (not `reqwest`) so
# scraper requests carry a real Chrome TLS/HTTP2 fingerprint
# (`wreq_util::Profile`) instead of one trivially flagged by fingerprinting
# middleboxes on sites like impots.gouv.fr. Same crates/versions/features as
# `demo-rust-fyde`'s own `host/http.rs`, which this is ported from. Building
# it vendors a patched BoringSSL (`btls-sys`), which needs
# `cmake`/`perl`/`go`/`libclang` at build time — see `shell.nix`.
wreq = { version = "0.16.1", features = ["cookies", "charset", "gzip", "brotli", "deflate", "zstd", "form", "json", "stream", "webpki-roots"] }
wreq-util = "0.2.0"
# `fyde.browser` (see the `tao` entry above) — the actual webview.
wry = "0.57"
xdg = "2.5.2"

# Serves the runtime's tasks to `tokio-console` (on `127.0.0.1:6669`) when built
# with `RUSTFLAGS="--cfg tokio_unstable"`, which `tokio/tracing` needs to record
# task data anyway (see `install_tracing` in `src/lib.rs`). A cfg rather than a
# Cargo feature: `../application`'s Gradle plugin can't pass `--features` to the
# `cargo build` it runs, only environment variables, so its debug builds turn
# this on through `RUSTFLAGS`.
[target.'cfg(tokio_unstable)'.dependencies]
console-subscriber = "0.5.0"
tokio = { version = "1.53.1", features = ["tracing"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

# Exports the `Java_io_crates_keyring_Keyring_00024Companion_initializeNdkContext`
# JNI entry point the Android app must call once at startup — see the sdk
# CLAUDE.md's `secrets` section.
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"

# Freedesktop Secret Service (GNOME Keyring, KWallet, ...) over `libdbus`,
# which `wry`/`tao` already need on Linux (see `shell.nix`).
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

# Argon2id runs as OPAQUE's key-stretching function on every login/registration
# (see `users/crypto.rs`'s `high_effort_ksf`), and its RFC 9106 low-memory
# params (64 MiB, 3 iterations, 4 lanes) are deliberately expensive. Without
# this override, an unoptimized debug build takes ~3s per call versus ~200ms
# in release — opting just these crates into full optimization even under
# `cargo build`/`cargo test` (no --release) keeps debug builds usable without
# losing debug info for the rest of this crate.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[dev-dependencies]
# Only used to hand-build minimal PDF fixtures for `documents/transcript.rs`
# tests; extraction itself uses `pdf_oxide` (a regular dependency).
lopdf = "0.39"
# Only used to hand-build a `log` record for `tools::log` tests.
log = "0.4.34"
mockall = "0.15.0"
tempfile = "3.14.0"
tokio = { version = "1.53.1", features = ["test-util", "rt-multi-thread", "net", "io-util"] }
